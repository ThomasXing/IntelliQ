<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答对话框</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #chat-container {
            width: 50%;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background: #fff;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
        }
        #fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            background-color: #007bff;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        #fullscreen-btn:hover {
            background-color: #0056b3;
        }
        #chat-output {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #e9e9e9;
        }
        #input-container {
            display: flex;
            margin-top: 10px;
        }
        #chat-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin: 0 7px 0 0;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: 100vw;
            max-height: 100vh;
            border-radius: 0;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .fullscreen #chat-output {
            height: calc(100% - 60px);
        }
        #mic-btn {
            background-color: #28a745;
            margin-left: 10px;
        }
        #mic-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <button id="fullscreen-btn">全屏</button>
        <div id="chat-output"></div>
        <div id="input-container">
            <input type="text" id="chat-input" placeholder="输入问题...">
            <button id="send">发送</button>
            <!-- <button id="mic-btn" onclick="toggleMic()">🎤</button> -->
        </div>
        <div style="margin-top: 10px;">
            <label>
                <input type="checkbox" id="stream-toggle">
                启用流式响应
            </label>
        </div>
    </div>
    <script>
        // 获取DOM元素
        const questionInput = document.getElementById('chat-input');
        const sendButton = document.getElementById('send');
        const streamToggle = document.getElementById('stream-toggle');
        // 生成会话ID
        const sessionId = 'session_' + Date.now();
        
        // 发送按钮点击事件
        sendButton.addEventListener('click', function() {
            sendMessage();
        });
        
        // 按Enter键发送问题
        questionInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        function sendMessage() {
            const message = questionInput.value.trim();
            if (!message) return;
            
            // 清空输入框
            questionInput.value = '';
    
            // 显示用户输入的问题
            const chatOutput = document.getElementById('chat-output');
            chatOutput.innerHTML += '<div style="margin-bottom: 10px;"><strong>你:</strong> ' + message + '</div>';
            
            // 创建新的回答容器
            const responseDiv = document.createElement('div');
            responseDiv.style.marginBottom = '15px';
            responseDiv.innerHTML = '<strong>回答:</strong> <span class="typing">思考中...</span><span class="response-time"></span>';
            chatOutput.appendChild(responseDiv);
            const typingSpan = responseDiv.querySelector('.typing');
            const responseTimeSpan = responseDiv.querySelector('.response-time');
            
            // 记录请求开始时间
            const startTime = Date.now();
            let isFirstResponse = true;
            
            // 获取流式响应设置
            const useStream = streamToggle.checked;
            
            if (useStream) {
                // 使用SSE流式响应
                // 关闭之前的EventSource（如果存在）
                if (window.eventSource) {
                    window.eventSource.close();
                }
                
                // 创建新的EventSource连接
                const url = `/multi_question?question=${encodeURIComponent(message)}&session_id=${sessionId}&stream=true`;
                window.eventSource = new EventSource(url);
                
                let fullResponse = '';
                
                // 处理接收到的消息
                window.eventSource.onmessage = function(event) {
                    const data = event.data;
                    
                    // 检查是否是结束信号
                    if (data === '[DONE]') {
                        window.eventSource.close();
                        return;
                    }
                    
                    // 计算首次响应时间
                    if (isFirstResponse) {
                        const responseTime = Date.now() - startTime;
                        responseTimeSpan.innerHTML = ` <span style="color: #666; font-size: 0.8em;">(响应时间: ${responseTime}ms)</span>`;
                        isFirstResponse = false;
                    }
                    
                    // 累加响应内容
                    fullResponse += data;
                    
                    // 更新显示
                    typingSpan.innerHTML = fullResponse;
                    
                    // 自动滚动到底部
                    chatOutput.scrollTop = chatOutput.scrollHeight;
                };
                
                // 处理错误
                window.eventSource.onerror = function(error) {
                    console.error('EventSource failed:', error);
                    typingSpan.innerHTML += '<span style="color: red;">连接中断，请重试</span>';
                    window.eventSource.close();
                };
            } else {
                // 使用普通AJAX请求
                fetch(`/multi_question?question=${encodeURIComponent(message)}&session_id=${sessionId}&stream=false`)
                    .then(response => response.json())
                    .then(data => {
                        // 计算响应时间
                        const responseTime = Date.now() - startTime;
                        responseTimeSpan.innerHTML = ` <span style="color: #666; font-size: 0.8em;">(响应时间: ${responseTime}ms)</span>`;
                        
                        // 显示响应
                        typingSpan.innerHTML = data.response;
                        
                        // 自动滚动到底部
                        chatOutput.scrollTop = chatOutput.scrollHeight;
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        typingSpan.innerHTML = '<span style="color: red;">请求失败，请重试</span>';
                    });
            }
        }
        var fullScreenBtn = document.getElementById('fullscreen-btn');
        var chatContainer = document.getElementById('chat-container');

        fullScreenBtn.addEventListener('click', function() {
            if (chatContainer.classList.contains('fullscreen')) {
                chatContainer.classList.remove('fullscreen');
                fullScreenBtn.textContent = '全屏';
            } else {
                chatContainer.classList.add('fullscreen');
                fullScreenBtn.textContent = '还原';
            }
        });
      </script>
</body>
</html>
